name: Surveillance annonces in'li

on:
  schedule:
    - cron: "*/15 * * * *" # filet de sécurité interne GitHub (peu fiable seul, voir cron-job.org)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: inli-watch
  cancel-in-progress: false # met en file d'attente plutôt que d'annuler, pour ne rater aucun passage

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la vérification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_URL: ${{ vars.SEARCH_URL }}
          MAX_RENT: ${{ vars.MAX_RENT }}
          MIN_SURFACE: ${{ vars.MIN_SURFACE }}
          MIN_ROOMS: ${{ vars.MIN_ROOMS }}
          CITIES: ${{ vars.CITIES }}
        run: python scraper.py

      - name: Sauvegarder l'état (annonces déjà vues)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_refs.json
          git diff --staged --quiet || git commit -m "Update seen refs [skip ci]"
          git pull --rebase
          git push
